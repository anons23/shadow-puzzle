<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>promo</title>
<style>body{margin:0;background:#111}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import { drawScene, drawTitle, PRESETS } from './promo.js';
const { THEMES, buildModel } = PRESETS;
const q = new URLSearchParams(location.search);
const kind = q.get('kind'), lang = q.get('lang') || 'ru';
const TXT = { ru: { title: 'Тени', tag: 'Поверни предмет — поймай тень' }, en: { title: 'Shadows', tag: 'Turn the object, catch the shadow' } }[lang];
const house = buildModel(['house']);
const HOUSE = { ry: -45.75, rx: -28.03, rz: 0 };
const OFF = { ry: -38, rx: -21, rz: 0 };
const c = document.getElementById('c'), ctx = c.getContext('2d');
const size = { icon: [512, 512], cover: [800, 470], showcase: [1560, 520], banner: [1920, 1080], vertical: [1080, 1920], 'cg-landscape': [1920, 1080], 'cg-portrait': [800, 1200], 'cg-square': [800, 800] }[kind];
c.width = size[0]; c.height = size[1];
const [W, H] = size;
if (kind === 'icon') {
  drawScene(ctx, W, H, { theme: THEMES[0], model: house, rot: HOUSE, target: HOUSE, outline: true, glow: 0.12,
    wall: { x: 266, y: 214, s: 96 }, lightR: 330, tableY: 410, obj: { x: 0, y: 0, s: 1 }, showObject: false,
    candle: { x: 104, y: 498, k: 1.7 }, vignette: 0.55, dust: 26, seed: 3 });
} else if (kind === 'cover') {
  drawScene(ctx, W, H, { theme: THEMES[0], model: house, rot: OFF, target: HOUSE, outline: true, glow: 0,
    wall: { x: 575, y: 158, s: 62 }, lightR: 330, tableY: 300, obj: { x: 585, y: 392, s: 40 },
    candle: { x: 410, y: 458, k: 1.25 }, vx: 0.7, vignette: 0.7, dust: 34, seed: 5 });
  drawTitle(ctx, { title: TXT.title, tag: TXT.tag, x: 46, y: lang === 'ru' ? 205 : 195, size: lang === 'ru' ? 104 : 84 });
} else if (kind === 'showcase') {
  drawScene(ctx, W, H, { theme: THEMES[0], model: house, rot: HOUSE, target: HOUSE, outline: true, glow: 0.5,
    wall: { x: 1060, y: 180, s: 74 }, lightR: 520, tableY: 360, obj: { x: 1105, y: 452, s: 38 },
    candle: { x: 840, y: 505, k: 1.45 }, vx: 0.68, vignette: 0.68, dust: 60, seed: 9 });
  drawTitle(ctx, { title: TXT.title, tag: TXT.tag, x: 130, y: 260, size: lang === 'ru' ? 150 : 120 });
}
if (kind === 'banner') {
  drawScene(ctx, W, H, { theme: THEMES[0], model: house, rot: HOUSE, target: HOUSE, outline: true, glow: 0.45,
    wall: { x: 1290, y: 360, s: 128 }, lightR: 760, tableY: 700, obj: { x: 1330, y: 905, s: 70 },
    candle: { x: 1010, y: 1010, k: 2.3 }, vx: 0.66, vignette: 0.66, dust: 80, seed: 11 });
  drawTitle(ctx, { title: TXT.title, tag: TXT.tag, x: 190, y: 520, size: lang === 'ru' ? 230 : 180 });
}
if (kind === 'vertical') {
  drawScene(ctx, W, H, { theme: THEMES[0], model: house, rot: HOUSE, target: HOUSE, outline: true, glow: 0.45,
    wall: { x: 560, y: 820, s: 150 }, lightR: 760, tableY: 1260, obj: { x: 610, y: 1560, s: 78 },
    candle: { x: 270, y: 1700, k: 2.6 }, vx: 0.5, vignette: 0.6, dust: 90, seed: 13 });
  drawTitle(ctx, { title: TXT.title, tag: TXT.tag, x: 150, y: 470, size: lang === 'ru' ? 200 : 160 });
}
// CrazyGames covers: only the game title as text, no tagline, no logos.
if (kind === 'cg-landscape') {
  drawScene(ctx, W, H, { theme: THEMES[0], model: house, rot: OFF, target: HOUSE, outline: true, glow: 0.15,
    wall: { x: 1290, y: 360, s: 128 }, lightR: 760, tableY: 700, obj: { x: 1330, y: 905, s: 70 },
    candle: { x: 1010, y: 1010, k: 2.3 }, vx: 0.66, vignette: 0.66, dust: 80, seed: 11 });
  drawTitle(ctx, { title: 'Shadows', x: 170, y: 600, size: 230 });
}
if (kind === 'cg-portrait') {
  drawScene(ctx, W, H, { theme: THEMES[0], model: house, rot: OFF, target: HOUSE, outline: true, glow: 0.15,
    wall: { x: 420, y: 590, s: 108 }, lightR: 560, tableY: 820, obj: { x: 450, y: 1010, s: 58 },
    candle: { x: 190, y: 1130, k: 2.0 }, vx: 0.5, vignette: 0.6, dust: 60, seed: 13 });
  drawTitle(ctx, { title: 'Shadows', x: 400, y: 230, size: 132, center: true });
}
if (kind === 'cg-square') {
  drawScene(ctx, W, H, { theme: THEMES[0], model: house, rot: OFF, target: HOUSE, outline: true, glow: 0.15,
    wall: { x: 470, y: 330, s: 82 }, lightR: 520, tableY: 570, obj: { x: 530, y: 690, s: 48 },
    candle: { x: 290, y: 770, k: 1.7 }, vx: 0.6, vignette: 0.62, dust: 50, seed: 17 });
  drawTitle(ctx, { title: 'Shadows', x: 400, y: 150, size: 120, center: true });
}
window.__done = c.toDataURL('image/png');
</script></body></html>
